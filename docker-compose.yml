services:
  postgres:
    image: postgres:16-alpine
    container_name: tavolo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-tavolo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tavolo_secret}
      POSTGRES_DB: ${DB_NAME:-tavolo_pos}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-tavolo}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Opcional: pgAdmin para inspección visual de la base de datos
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tavolo_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tavolo.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - postgres
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
